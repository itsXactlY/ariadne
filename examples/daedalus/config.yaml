# config.yaml — all dd_tui / dd_agent need. It lives BESIDE the binary:
#
#   dd_tui --init                    # writes this file and the folders next to the binary
#   dd_tui --init --from FILE        # ... starting from an existing config
#   dd_tui --home DIR                # run from another folder (config.yaml, skills/, rules/, state/ ...)
#
# Nothing is read from ~/.daedalus (the Python Daedalus's home). `dd import-daedalus`
# copies skills and skins over once, on request.
#
# Env overrides: DD_HOME DD_BASE_URL DD_MODEL DD_API_KEY DD_MAX_TURNS.
# logs/ is optional: dd_tui writes stderr there while the screen is up.
# The values below are the reference box's (daedalus doctor on :8080, the
# mazemaker pod on :8765); the comments say what to change on another one.

model:
  base_url: http://127.0.0.1:8080/v1     # OpenAI-compatible; must end in /v1
  name: qwen3.8-flash-next-coder-iq1_m    # sent as "model"; llama-server ignores it
  api_key: ""                             # llama.cpp needs none

agent:
  max_turns: 50            # LLM calls per turn; keep it low on a slow local model
  system_prompt: ""        # the operator's own voice; the composer adds role, workflow, retrieval
  reasoning_effort: none   # off | low | medium | high | xhigh | max | ultra (only what the template has)
  thinking_budget: 1024    # max thinking tokens per call on a local server; 0 = no cap
  contract: true           # the short workflow contract: plan first, verify by running, close the turn

display:
  skin: neural             # ./skins/<skin>.yaml if present, else the built-in neural palette
  show_reasoning: true     # false starts with reasoning cards folded to one line
  verbose: normal          # off | normal | full — /verbose at runtime, DD_VERBOSE for the environment

# The context tape: what each request carries.
context:
  payload_tape: true       # render once, append only; false renders every call from scratch
  reasoning_window: 3      # newest reasoning blocks kept at an epoch start
  tool_group_ttl: 8        # newest tool exchanges kept whole at an epoch start

# Rebase from retrieval at the fast-layer watermarks (server tokens, both slots).
# The mark is clamped to the server's real window (/props n_ctx) minus a sixteenth.
compression:
  fast_layer_tokens: 65536 # the GPU-resident KV budget; 0 = rebase at hot_swap_hard_ratio of n_ctx
  watermarks:
    low: 0.7               # erase an idle sidekick slot's leftovers
    high: 0.88             # prewarm the next epoch between turns
    hard: 0.95             # swap to it, or rebase inside the turn
  hot_swap_hard_ratio: 0.9
  protect_last_n: 10       # the tail a rebase keeps (shrunk if the new epoch would not fit)
  prewarm: true

memory:
  turn_recall: true        # look something up for the question; false switches every offer below off
  soak:
    window_turns: 18       # an epoch's head window: 2x this many messages before the question

# Skills: ./skills is yours; the maze's catalogue is merged in under it.
skills:
  enabled: true
  auto_route: true         # the harness offers a fitting skill at a turn's start and when the task shifts
  maze: true               # merge the maze's skill catalogue under ./skills (disk first)
  external_dirs: []        # read-only skill trees, e.g. [~/.daedalus/skills]
  disabled: []             # skill names to hide

# What the harness looks up for the model, and when (docs/KNOWLEDGE.md).
knowledge:
  deep_ms: 1500            # a turn start waits this long for the pod's recall; a late answer rides the next tool result
  deep_recall_ms: 30000    # ... and this long when the question is about the past ("what did we decide ...")
  budget:
    turn_tokens: 600       # the note on a question
    hint_tokens: 250       # a note after a tool batch
    max_turn_tokens: 1500  # everything retrieval adds to one turn
  confidence:              # calibrated with `dd replay` on real prompts against the real catalogue
    offer_score: 0.15      # a skill is offered when it holds this share of the question's evidence ...
    offer_mass: 6.5        # ... and that is this much evidence in absolute terms (two terms, or one rare one and more)
    open_score: 0.25       # at this share the head of the skill is opened for the model
  rank:                    # BM25F field weights
    name: 8
    tags: 3
    group: 1.5
    gist: 1
    k1: 2.0
  mid_turn:
    shift: true            # the task moved to something new
    failure: true          # a call failed twice, or its error is a known one
    stall: true            # the same call twice, or three blind explorations
  rules: true              # tripwires: ./rules/*.md and the maze's rule: rows
  stopword_languages: [en, de]   # words dropped from queries and cards; add nl fr es pt it ro sv da no fi pl cs ... for prompts in those languages (a short word in
                                 # another language can be a technical term in yours: "os", "ci", "var" are real words elsewhere, so they are opt-in)

# What dd learns from its own use (docs/LEARN.md). Priors and learned terms are bounded and reversible; drafting skills is OFF until you say so:
# a drafted skill is later offered to the model, so read `dd learn status` and the drafts under skills/ before turning it on.
learn:
  enabled: true
  feedback: true           # learn priors and query terms from what was offered and opened
  author: false            # draft skills from fixed failures (probation first); a human skill of the same name always wins
  max_drafts_per_day: 3

# Local tools and these stay in the window; the rest is found with tool_search.
tool_search:
  enabled: true
  always_load:
    - mazemaker_recall
    - mazemaker_think
    - mazemaker_get
    - mazemaker_remember

# Streamable-HTTP MCP only (transport: http); stdio servers are skipped.
# The server that answers mazemaker_recall is the tape's memory: soaks, rebases,
# skills, /resume. Without one the tape forgets what ages out.
# instructions: what to do with the server's own protocol text — harness (default for the
# maze: the harness's retrieval contract replaces it), verbatim, or off.
mcp_servers:
  mazemaker:
    enabled: true
    transport: http
    url: http://127.0.0.1:8765/mcp
    instructions: harness
    # headers:                            # extra request headers; ${VAR} is read from the environment
    #   Authorization: "Bearer ${MAZEMAKER_TOKEN}"
    tools:                                # optional per-tool switch
      mazemaker_prune: {enabled: false}

# What one tool result may carry into the tape. These are the numbers the harness shipped before the
# section existed, so leaving them alone changes nothing; raising one raises the context cost of every
# result that hits it. read_bytes is the byte budget a single read_file call returns; max_line_length
# cuts one long line and names how much was cut.
tool_output:
  max_bytes: 8000          # run_terminal: bytes handed back; the rest is read and dropped, never held
  max_lines: 2000          # read_file: lines handed back when the call asks for no limit
  max_line_length: 4000    # read_file: bytes of one line, then a cut marker
  read_bytes: 1048576      # read_file: bytes a single call returns

# run_terminal is a guard, not a sandbox: it refuses obviously destructive commands (sudo, recursive rm on broad paths, force-push, ...); add command words here.
command_denylist: []
